- id: consolidated commands
  status: done
  features:
  - consolidated config file named `.yaml`, or `.yaml.yaml` for configuring
    all features. Including spec validation+diags, schema validation+diags,
    lint validation+diags, formatting, parser and renderer tuning.
  - yaml as|to|convert [OPTS] cbor|json[cl] PATH+|<<stdin # conversion
  - yaml validate [OPTS] PATH+|<<stdin # TODO: should it include spec, schema and lint?
  - yaml lint [OPTS] PATH+|<<stdin
  - yaml lsp [OPTS] # v1 is stdio
  - yaml format [OPTS] PATH+|<<stdin
  - yaml [query] EXPR PATH+|<<stdin
  - yaml help [CMD]

- id: json-schema-yaml-directive
  status: done
  feature:
