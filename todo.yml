%YAML 1.2
---
- id: schema
  with:
    - id: tag
      feature:
      - read schema tag
      - write (configurable/optional) schema tag
    - id: database
      feature:
      - abstract schema database interface
      - add this schema db: https://www.schemastore.org/
      - add local sqlite schema database
      - cache schemas in the local db

# - id: json
#   info:
#   - https://www.rfc-editor.org/subjects/json/

- id: cbor
  why:
  - CBOR <-> YAML
  - CBOR <-> JSON
  - Use CBOR for index
  with:
  - id: rfc8949-cbor
    info:
    - https://www.rfc-editor.org/rfc/inline-errata/rfc8949.html
  - id: rfc8746-cbor-typed-arrays
    info:
    - https://www.rfc-editor.org/info/rfc8746/

- id: rfc6902-json-patch
  info:
  - https://datatracker.ietf.org/doc/rfc6902/

- id: rfc6901-json-pointer
  info:
  - https://datatracker.ietf.org/doc/rfc6901/
  - https://errata.rfc-editor.org/eid8314/
  with:
  - id: rfc-json-relative-pointer
    info:
    - https://www.ietf.org/archive/id/draft-hha-relative-json-pointer-00.html

- id: rfc6902-json-merge-patch
  info:
  - https://datatracker.ietf.org/doc/rfc7396/

- id: jsonl

- id: jsonc

- id: json-ld

- id: json-schema

- id: json-hyper-schema

- id: rfc8785-json-canonicalization-scheme
  info:
  - https://www.rfc-editor.org/rfc/inline-errata/rfc8785.html

- id: rfc9535-jsonpath
  with:
  - id: rfc9535-jsonpath-implementation
    info:
    - https://datatracker.ietf.org/doc/rfc9535/
  - id: rfc9535-jsonpath-community-tests
    info:
    - https://github.com/cburgmer/json-path-comparison
    feature:
    - compliance tests
    - cross-implementation consensus analysis

- id: yaml-merge

- id: streaming-resumability
  with:
    - id: incremental-feed
      status: done
      feature:
      - push-style parser fed in chunks (sockets, async, pipes)
      - report "need more input" instead of treating an empty buffer as EOF
      - explicit end-of-input signal
    - id: checkpoint-restore
      status: done
      feature:
      - snapshot parser/lexer state (byte offset, level stack, tag handles, anchors)
      - serializable checkpoint value
      - seek source and resume event emission from a checkpoint
    - id: document-boundary-resume
      status: done
      feature:
      - record byte offset / line at each document boundary
      - start parse() at a given offset with %YAML / %TAG directives restored
    - id: error-recovery
      status: done
      feature:
      - after a parser error, skip to the next document marker
      - continue parsing the remaining documents and collect errors

- id: editor
  with:
    - id: syntax-highlighting

    - id: multiline
      info: [https://yaml-multiline.info/]
      feature:
      - tutorial
      - visual aids

    - id: embedded-lang
      info: [https://github.com/harrydowning/vscode-yaml-embedded-languages]
      feature:
      - embedded-lang-region IDE integration
      - syntax highlighting


