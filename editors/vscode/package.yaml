#!/usr/bin/env yaml as json
#
# Schemas, all of which this file must satisfy:
# - VS Code's, which is dynamically localized at runtime:
#   https://github.com/microsoft/vscode/blob/HEAD/src/vs/workbench/services/extensions/common/extensionsRegistry.ts#L174
#   This extension (schemas/) gives it to yamllsp.
# - npm's package.json, from SchemaStore, which this extension downloads
#   (json.schemaDownload.enable).
# - package.schema.yaml: the fields vsce requires, which neither of them
#   does.
#
# See also:
# https://code.visualstudio.com/api/references/extension-manifest
%SCHEMA vscode://schemas/vscode-extensions https://www.schemastore.org/package.json package.schema.yaml
---
name: yaml-plus-lsp
displayName: yaml+lsp
description: >-
  Lint diagnostics, JSON Schema validation, %GLOBAL/%SCHEMA directive support,
  embedded languages in block scalars, a grid view and a semantic diff for YAML
version: 0.7.0
publisher: nimyaml
license: MIT
private: true
engines: {vscode: ^1.82.0}
homepage: https://yaml.localhost/
repository:
  type: git
  url: https://yaml.localhost/
categories: [Programming Languages, Linters, Snippets, Formatters, Visualization]
icon: icons/yaml-plus-256.png
galleryBanner:
  color: "#C0262D" # ...red font in icon
  theme: dark
keywords:
  - yaml
  - json
  - jsonc
  - jsonl
  - cbor
  - data visualization
  - drilldown
  - hierarchy
  - grid
  - overview
  - diff
activationEvents:
  - "onLanguage:yaml"
  - "onLanguage:json"
  - "onLanguage:jsonc"
  - "onLanguage:jsonl"
  - "workspaceContains:**/.nimyaml-lint.yaml"
  - "workspaceContains:**/.yaml"
  - "workspaceContains:**/.yaml.yaml"
  - "onCustomEditor:yaml+lsp.grid"
# bundled from extension.js and its dependencies by `bun run build`
main: dist/extension.js
scripts:
  test: "bun --test test/*.test.js"
  # the extension, and the grid's webview script and stylesheet (dist/grid)
  build: >-
    esbuild extension.js --bundle --platform=node --format=cjs --target=node18
    --external:vscode --minify --outfile=dist/extension.js &&
    esbuild grid/webview/main.ts grid/webview/grid.css --bundle --format=iife
    --target=es2022 --minify --outdir=dist/grid
  # esbuild strips the webview's types without checking them
  typecheck: tsc -p grid/webview
  # the placeholder grammar (the extension writes the real one on activation)
  # and the bundle
  vscode:prepublish: bun embedded/grammar.js && bun run build
  vscode:package: vsce package --allow-missing-repository --skip-license --baseContentUrl . --baseImagesUrl .
  vscode:install: code --force --install-extension yaml-plus-lsp-*.vsix
contributes:
  languages:
    - id: yaml
      aliases: [yaml, YAML]
      configuration: languages/yaml.language-configuration.json
      extensions: [.yaml, .yml]
      mimetypes: [application/yaml, "application/x-yaml", text/yaml, "text/x-yaml"]
      filenames: []
      filenamePatterns: []
      icon:
        dark: "icons/yaml-dark.svg"
        light: "icons/yaml-light.svg"
    - id: json
      aliases: [JSON, json]
      configuration: languages/json.language-configuration.json
      extensions: [.json, .geojson, .har, .jsonld, .webmanifest]
      mimetypes:
        - application/json
        - application/manifest+json
        - application/ld+json
        - application/geo+json
      filenames: []
      icon:
        dark: "icons/json-dark.svg"
        light: "icons/json-light.svg"
    - id: jsonc
      aliases: [JSON with Comments, jsonc]
      configuration: languages/jsonc.language-configuration.json
      extensions: [.jsonc, ".code-workspace", ".code-profile"]
      mimetypes: [application/jsonc]
      filenames: []
      icon:
        dark: "icons/jsonc-dark.svg"
        light: "icons/jsonc-light.svg"
    - id: jsonl
      aliases: [JSON Lines, jsonl, ndjson]
      configuration: languages/jsonl.language-configuration.json
      extensions: [.jsonl, .ndjson]
      mimetypes: [application/jsonl, "application/x-ndjson"]
      filenames: []
      icon:
        dark: "icons/jsonl-dark.svg"
        light: "icons/jsonl-light.svg"
    - id: cbor
      aliases: [CBOR, cbor]
      configuration: languages/cbor.language-configuration.json
      extensions: [.cbor, .cbordiag]
      filenames: []
      mimetypes: [application/cbor, "application/cbor-diagnostic"]
      icon:
        dark: "icons/cbor-dark.svg"
        light: "icons/cbor-light.svg"
  grammars:
    - language: json
      scopeName: source.json
      path: syntaxes/json.tmLanguage.json
    - language: jsonc
      scopeName: source.json.comments
      path: syntaxes/jsonc.tmLanguage.json
    - language: jsonl
      scopeName: source.json.lines
      path: syntaxes/jsonl.tmLanguage.json
    - language: cbor
      scopeName: source.cbor
      path: syntaxes/cbor.tmLanguage.json
    - scopeName: yaml+lsp.embedded.injection
      path: syntaxes/yaml-embedded.tmLanguage.json
      injectTo: [source.yaml]
  configuration:
    title: yaml+lsp
    properties:
      yaml+lsp.path:
        type: string
        default: yaml
        markdownDescription: >-
          Command that starts the language server: a name looked up on `PATH` or
          an absolute path.
      yaml+lsp.args:
        type: array
        items: {type: string}
        default: [lsp]
        markdownDescription: >-
          Arguments passed to the command. `yaml` needs `lsp`.
      yaml+lsp.trace.server:
        type: string
        enum: [off, messages, verbose]
        default: off
        description: >-
          Traces the communication between VS Code and yamllsp in the "yaml+lsp
          Trace" output channel.
      yaml+lsp.embedded.enabled:
        type: boolean
        default: true
        markdownDescription: >-
          Provide language features (diagnostics, completion, hover, go to
          definition, rename, …) for code in literal block scalars whose
          language is known: `query: | # sql`. Each such block is written to a
          file of its language (a *projection*) that the language's own extension
          serves.
      yaml+lsp.embedded.diagnostics.enabled:
        type: boolean
        default: true
        markdownDescription: >-
          Show the diagnostics of embedded code on the YAML document. Diagnostics
          are only published for files a server analyzes, so this writes the
          projections of every open YAML document as it changes rather than on
          the first request.
      yaml+lsp.embedded.diagnostics.debounceMs:
        type: number
        default: 400
        description: >-
          Delay in milliseconds after an edit before the projections are
          rewritten.
      yaml+lsp.embedded.projection.root:
        type: string
        enum: [workspace, temp]
        enumDescriptions:
          - >-
            In the workspace folder, so that imports and project configuration
            resolve.
          - >-
            In the system's temporary directory: nothing in the workspace, but
            most cross-file resolution fails.
        default: workspace
        description: Where projections are written.
      yaml+lsp.embedded.projection.directory:
        type: string
        default: ".yaml-embedded"
        description: >-
          The directory in the workspace folder that holds the projections when
          they are written to the workspace.
      yaml+lsp.embedded.projection.manageExcludes:
        type: boolean
        default: true
        markdownDescription: >-
          Add the projection directory to `files.exclude` and `search.exclude` in
          the workspace settings.
      yaml+lsp.embedded.semanticTokens.enabled:
        type: boolean
        default: true
        markdownDescription: >-
          Show the semantic highlighting of embedded languages that provide it.
          Only token types yamllsp's legend has are kept; the others keep the
          colours of the grammar.
      yaml+lsp.embedded.warnOnFoldedScalars:
        type: boolean
        default: true
        markdownDescription: >-
          Warn when a folded block scalar (`>`) names a language: folding joins
          lines, so its value is not the code shown, and it gets no language
          features.
      yaml+lsp.embedded.stickyDirective:
        type: string
        default: "yaml-lsp"
        markdownDescription: >-
          Comment that sets the language of all block scalars below it: `#
          yaml-lsp: python`. A bare `# yaml-lsp` clears it. The comment on a
          block's header takes precedence.
      yaml+lsp.embedded.compat.yamlEmbeddedLanguagesDirective:
        type: boolean
        default: true
        markdownDescription: >-
          Also accept `# yaml-embedded-languages: <language>` as the sticky
          directive.
      yaml+lsp.embedded.aliases:
        type: object
        additionalProperties: {type: string}
        default: {}
        markdownDescription: >-
          Extra names for languages in comments: name → VS Code language ID,
          e.g. `{"tpl": "handlebars"}`. Without it a language is known by its ID
          and by the aliases and file extensions its extension declares
          (`python`, `Python`, `py`). These names take precedence over those.
      yaml+lsp.embedded.grammars:
        type: object
        default: {}
        additionalProperties:
          anyOf:
            - type: string
            - type: object
              required: [scopeName]
              properties:
                scopeName:
                  type: string
                  description: TextMate scope of the grammar.
                language:
                  type: string
                  description: >-
                    VS Code language ID the block is, for language features,
                    comments and brackets.
        markdownDescription: >-
          Grammars for names in comments: name → TextMate scope, e.g.
          `{"regex": "source.regexp.python"}` for a grammar that is not a
          language, or `{"scopeName": …, "language": …}` to colour a language
          with another grammar. Installed languages need no entry: each is
          coloured by the grammar its extension contributes. Changes take effect
          after reloading the window.
      yaml+lsp.embedded.keyRules:
        type: array
        default: []
        items:
          type: object
          required: [keyPattern, language]
          properties:
            keyPattern:
              type: string
              description: >-
                Regular expression (JavaScript) matched against the key whose
                value the block scalar is.
            language:
              type: string
              description: VS Code language ID.
            filePattern:
              type: string
              description: "Glob the YAML document's path must match."
        markdownDescription: >-
          Choose the language by key instead of a comment, e.g. `{"keyPattern":
          "^run$", "language": "shellscript", "filePattern":
          "**/.github/workflows/*.yml"}`. Comments take precedence.
      yaml+lsp.paths.statusBar:
        type: boolean
        default: true
        description: >-
          Show the path of the node at the cursor in the status bar of YAML,
          JSON and JSONC files. Clicking it copies the path.
      yaml+lsp.paths.format:
        type: string
        enum: [pointer, path]
        enumDescriptions:
          - "A JSON Pointer (RFC 6901): /a/0/b"
          - "A JSON Path (RFC 9535): $.a[0].b"
        default: pointer
        description: >-
          How paths are shown in the status bar and in "Go to Path…", and which
          one clicking the status bar copies.
  commands:
    - command: yaml+lsp.restart
      title: "YAML+: Restart yamllsp"
    - command: yaml+lsp.embedded.showRegions
      title: "YAML+: Show Embedded Language Regions"
    - command: yaml+lsp.embedded.formatRegion
      title: "YAML+: Format Embedded Language Region"
    - command: yaml+lsp.embedded.revealProjection
      title: "YAML+: Open Projection of Embedded Language Region"
    - command: yaml+lsp.embedded.cleanProjections
      title: "YAML+: Delete Projections of Embedded Language Regions"
    - command: yaml+lsp.grid.open
      title: "YAML+: Open in Grid"
      icon: $(table)
    - command: yaml+lsp.paths.copyPointer
      title: "YAML+: Copy JSON Pointer"
    - command: yaml+lsp.paths.copyPath
      title: "YAML+: Copy JSON Path"
    - command: yaml+lsp.paths.goTo
      title: "YAML+: Go to Path…"
    - command: yaml+lsp.diff.withFile
      title: "YAML+: Compare Semantically with File…"
    - command: yaml+lsp.diff.withSaved
      title: "YAML+: Compare Semantically with Saved"
    - command: yaml+lsp.diff.withHead
      title: "YAML+: Compare Semantically with HEAD"
    - command: yaml+lsp.diff.selected
      title: "YAML+: Compare Selected Semantically"
  customEditors:
    - viewType: yaml+lsp.grid
      displayName: YAML+ Grid
      priority: option
      selector:
        - filenamePattern: "*.{yaml,yml}"
        - filenamePattern: "*.{json,jsonc}"
  menus:
    commandPalette:
      - command: yaml+lsp.grid.open
        when: editorLangId =~ /^(yaml|json|jsonc)$/
      - command: yaml+lsp.paths.copyPointer
        when: editorLangId =~ /^(yaml|json|jsonc)$/
      - command: yaml+lsp.paths.copyPath
        when: editorLangId =~ /^(yaml|json|jsonc)$/
      - command: yaml+lsp.paths.goTo
        when: editorLangId =~ /^(yaml|json|jsonc)$/
      - command: yaml+lsp.diff.withFile
        when: editorLangId =~ /^(yaml|json|jsonc)$/
      - command: yaml+lsp.diff.withSaved
        when: editorLangId =~ /^(yaml|json|jsonc)$/ && resourceScheme != untitled
      - command: yaml+lsp.diff.withHead
        when: editorLangId =~ /^(yaml|json|jsonc)$/ && resourceScheme == file
      # it needs files selected in the explorer
      - command: yaml+lsp.diff.selected
        when: "false"
    editor/context:
      - command: yaml+lsp.paths.copyPointer
        when: editorLangId =~ /^(yaml|json|jsonc)$/
        group: 9_cutcopypaste@10
      - command: yaml+lsp.paths.copyPath
        when: editorLangId =~ /^(yaml|json|jsonc)$/
        group: 9_cutcopypaste@11
      - command: yaml+lsp.paths.goTo
        when: editorLangId =~ /^(yaml|json|jsonc)$/
        group: navigation@90
    editor/title:
      - command: yaml+lsp.grid.open
        when: editorLangId =~ /^(yaml|json|jsonc)$/
        group: navigation
    explorer/context:
      - command: yaml+lsp.grid.open
        when: resourceLangId =~ /^(yaml|json|jsonc)$/
        group: navigation
      # next to VS Code's own "Compare Selected"
      - command: yaml+lsp.diff.selected
        when: listDoubleSelection && resourceLangId =~ /^(yaml|json|jsonc)$/
        group: 3_compare@30
# devDependencies only: the bundle carries what the extension needs
devDependencies: {"vscode-languageclient": 10.1.2, esbuild: 0.28.2}
