<!doctype html>
<meta charset="utf-8">
<!--
  <yaml-editor>, the component: what a host page imports,
    <link rel="html-import" href="yaml-editor/yaml-editor.html">
  and nothing else, so it is served as it is written, with no build. html-import.js reads all of
  it: the component it builds on (<code-editor>, from the ui-web-component workspace this package
  links), its catalogs and its template, whose data-module is its behaviour. Its documentation,
  examples, tour and tests are its developer page, index.html beside it.

  It has little UI of its own: the editor is <code-editor>'s, and what the server adds to it
  (diagnostics, completion, hovers, highlighting, links) is drawn by CodeMirror. Its own is the
  line under the text naming the node at the cursor, and the menu of the formats it names it in.
-->

<link rel="html-import" href="../code-editor/code-editor.html">

<!-- The editor fills the element; the status line under it is the component's own. Its colours
     and font are <code-editor>'s custom properties, so a page that restyles the editor restyles
     this line with it. The path is written left to right, as code is, in any page: a bdi keeps
     `$.a` or `#2 /a` from being reordered in a right-to-left one, while the line itself follows
     the page's direction. -->
<template data-element="yaml-editor" data-i18n data-module="yaml-editor.js" data-delegates-focus>
  <style>
    :host { display: flex; flex-direction: column; }
    :host([hidden]) { display: none; }
    code-editor { flex: 1; min-block-size: 0; }
    .status {
      display: flex; align-items: center; gap: .5rem; padding-block: 2px; padding-inline: 4px;
      color: var(--code-editor-dim, #6e7781); font-size: 12px;
      font-family: var(--code-editor-font, ui-monospace, "SF Mono", Menlo, Consolas, monospace);
    }
    .path {
      flex: 1; min-inline-size: 0; text-align: start; cursor: copy;
      font: inherit; color: inherit; background: none; border: 0; padding: 2px 4px; border-radius: 4px;
      white-space: pre; overflow: hidden; text-overflow: ellipsis;
    }
    .path:hover, .path:focus-visible { background: color-mix(in srgb, currentColor 12%, transparent); }
    select {
      font: inherit; color: inherit; background: transparent; border-radius: 4px;
      border: 1px solid var(--code-editor-line, #d0d7de);
    }
  </style>
  <code-editor data-ref="editor" part="editor" language="yaml"></code-editor>
  <div class="status" part="status">
    <button class="path" type="button" data-ref="path" data-on="click:copyShown" title="__MSG_click_to_copy__"><bdi dir="ltr" translate="no" data-ref="pathText"></bdi></button>
    <select data-ref="format" data-on="change:pickFormat" aria-label="__MSG_path_format__">
      <option value="pointer">__MSG_format_pointer__</option>
      <option value="path">__MSG_format_path__</option>
      <option value="fragment">__MSG_format_fragment__</option>
      <option value="absolute-fragment">__MSG_format_absolute_fragment__</option>
    </select>
  </div>
</template>
